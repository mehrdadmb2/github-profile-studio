name: Refresh contribution asset

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh contribution SVG
        run: node scripts/refresh-profile.mjs "$GITHUB_REPOSITORY_OWNER"

      - name: Commit the generated asset only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "assets/${GITHUB_REPOSITORY_OWNER,,}-heatmap.svg"
          if git diff --cached --quiet; then
            echo "No contribution asset changes."
            exit 0
          fi
          git commit -m 'chore: refresh contribution asset'
          git push
